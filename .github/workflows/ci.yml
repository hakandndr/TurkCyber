name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No deployment happens here. Staging deployment is added only after the
# deployment model is explicitly approved — see PRODUCTION_CUTOVER.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm scan:secrets

      - name: Typecheck
        run: pnpm check

      - name: Lint and format check
        run: pnpm lint

      # tests/content.test.ts asserts against dist/, so it verifies what
      # actually ships. `pnpm test` builds the site itself when dist/ is
      # missing, so this step is not a precondition — it is here to surface a
      # build failure as its own red step rather than inside the test run.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify private routes and drafts are absent from the build
        run: |
          set -euo pipefail
          test ! -d dist/boss
          grep -q 'Disallow: /boss' dist/robots.txt
          ! grep -q '/boss' dist/sitemap.xml
          # The draft gate must stay closed in a production build. This ran red
          # once, under NODE_ENV=test, and shipped draft content.
          test ! -d dist/haberler/ornek-haber-sablonu
          echo "private routes and drafts absent from the static build"

      # The same build with a hostile NODE_ENV. The publication gate must not
      # depend on ambient environment.
      - name: Draft gate holds under an unexpected NODE_ENV
        run: |
          set -euo pipefail
          rm -rf dist
          NODE_ENV=test pnpm build
          test ! -d dist/haberler/ornek-haber-sablonu
          echo "draft gate holds under NODE_ENV=test"
