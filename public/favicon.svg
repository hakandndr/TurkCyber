<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TurkCyber">
  <title>TurkCyber</title>
  <!--
    Favicon mark. The full <tc/> composition is not legible at 16px, so the
    brackets are dropped and the accent slash carries the identity alongside
    the letterforms. Letters are drawn as geometry rather than text so the icon
    does not depend on a font being available.
  -->
  <rect width="32" height="32" rx="6" fill="#0c0f10"/>
  <!-- t -->
  <path d="M7 9.5v11.2c0 1.6 .9 2.4 2.6 2.4h1.7" fill="none" stroke="#f1f5f4"
        stroke-width="2.6" stroke-linecap="round"/>
  <path d="M4.4 13h6.1" fill="none" stroke="#f1f5f4" stroke-width="2.6" stroke-linecap="round"/>
  <!-- c -->
  <path d="M21.6 14.2a4.6 4.6 0 1 0 0 7.2" fill="none" stroke="#f1f5f4"
        stroke-width="2.6" stroke-linecap="round"/>
  <!-- accent slash -->
  <path d="M28 8.5 24 24" fill="none" stroke="#21e67a" stroke-width="2.8" stroke-linecap="round"/>
</svg>
